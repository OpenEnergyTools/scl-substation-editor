<title>oscd-save Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Roboto:wght@300;400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Material+Icons&display=block">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<open-scd plugins='{
  "menu": 
  [
    {"name": "Open File", "translations": {"de": "Datei öffnen"}, "icon": "folder_open", "active": true, "src": "https://openscd.github.io/oscd-open/oscd-open.js"}, 
    {"name": "Save File", "translations": {"de": "Datei speichern"}, "icon": "save", "active": true, "src": "https://openscd.github.io/oscd-save/oscd-save.js"},
    {"name": "Wizarding", "translations": {"de": "Wizarding"}, "icon": "publish", "active": true, "src": "https://openenergytools.github.io/scl-wizarding/scl-wizarding.js"}
  ],
  "editor": 
  [
    {"name": "Substation", "translations": {"de": "Schaltanlage"}, "icon": "publish", "active": true, "src": "/dist/scl-substation-editor.js"}
  ]
}'></open-scd>

<script type="module">
import '@openenergytools/open-scd-core/open-scd.js';

const editor = document.querySelector('open-scd');
const params = (new URL(document.location)).searchParams;
for (const [name, value] of params) {
editor.setAttribute(name, value);
}
</script>

<script>
  const _customElementsDefine = window.customElements.define;
  window.customElements.define = (name, cl, conf) => {
    if (!customElements.get(name)) {
      try {
        _customElementsDefine.call(window.customElements, name, cl, conf);
      } catch (e) { console.warn(e); }
    }
  };
</script>
